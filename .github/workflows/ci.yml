name: CI - AI Data Augmentor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install boto3

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile src/augment_companies.py
          python -m py_compile cloud/lambda/lambda_function.py
          python -m py_compile cloud/src/upload_to_dynamodb.py
          python -m py_compile cloud/tests/test_lambda_local.py

      - name: Run local Lambda tests
        run: python cloud/tests/test_lambda_local.py

  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloud/terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color
